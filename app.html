<title>مخزن قطع الغيار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column, sticky top bar, fixed bottom tabs, bottom sheets for every form. Steel-graphite hero, safety-orange accent, hazard-tape amber for alarms. */
:root{
  --bg:#F2F1EF; --surface:#FFFFFF; --surface-2:#E8E6E3; --ink:#1D2125; --muted:#5F666E; --line:#DAD7D2;
  --accent:#C94C0A; --accent-ink:#FFFFFF; --accent-soft:#FDE3D2;
  --warn:#9C7200; --warn-soft:#FFF3C4; --danger:#C8102E; --danger-soft:#FBE0E4;
  --hz:#FFC20E; --hz-ink:#1A1A16;
  --hero:#23282E; --hero-ink:#F1F3F5; --hero-muted:#A3ACB5; --hero-btn:#FF6B1A; --hero-btn-ink:#1D0E04; --hero-line:rgb(255 255 255 / .08);
  --scrim:rgb(14 16 19 / .45);
  --shadow:0 1px 2px rgb(29 33 37 / .06),0 8px 22px rgb(29 33 37 / .07);
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1D21; --surface-2:#24282D; --ink:#ECEFF2; --muted:#9AA3AC; --line:#2E333A;
  --accent:#FF7A2E; --accent-ink:#1D0E04; --accent-soft:#3D2213;
  --warn:#F2C230; --warn-soft:#3A3010; --danger:#FF5A6A; --danger-soft:#40141C;
  --hz:#FFC20E; --hz-ink:#121210;
  --hero:#1F242A; --hero-ink:#F1F3F5; --hero-muted:#9AA3AC; --hero-btn:#FF6B1A; --hero-btn-ink:#1D0E04; --hero-line:rgb(255 255 255 / .07);
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 22px rgb(0 0 0 / .25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D21; --surface-2:#24282D; --ink:#ECEFF2; --muted:#9AA3AC; --line:#2E333A;
  --accent:#FF7A2E; --accent-ink:#1D0E04; --accent-soft:#3D2213;
  --warn:#F2C230; --warn-soft:#3A3010; --danger:#FF5A6A; --danger-soft:#40141C;
  --hz:#FFC20E; --hz-ink:#121210;
  --hero:#1F242A; --hero-ink:#F1F3F5; --hero-muted:#9AA3AC; --hero-btn:#FF6B1A; --hero-btn-ink:#1D0E04; --hero-line:rgb(255 255 255 / .07);
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 22px rgb(0 0 0 / .25);
  color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
button,a,label,input,select,textarea,[data-act]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
svg{flex:none}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px;padding-top:4px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:.4;transform:translateX(-34%)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:.5;transform:translateX(22%)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beacon{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 55%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes tape{to{background-position:28px 0}}
.view.a-tab > *{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.view.a-tab > *:nth-child(2){animation-delay:.05s}.view.a-tab > *:nth-child(3){animation-delay:.1s}
.view.a-tab > *:nth-child(4){animation-delay:.15s}.view.a-tab > *:nth-child(n+5){animation-delay:.2s}
body.edge-drag{overflow:hidden;user-select:none;-webkit-user-select:none}
#app.swiping{position:relative;z-index:1;background:var(--bg);box-shadow:0 0 0 300vmax var(--bg);will-change:transform}
#underlay{position:fixed;inset:0;z-index:0;background:var(--bg);overflow:hidden;pointer-events:none;will-change:transform}
#underlay .ul-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
#underlay .topbar{position:static}
#underlay .ul-dim{position:absolute;inset:0;background:#000;opacity:.12}
#fabSlot{transition:opacity .2s}
body.edge-drag #fabSlot{opacity:0}
.view.a-push{animation:pushIn .38s cubic-bezier(.32,.72,0,1) both}
.view.a-pop{animation:popIn .32s cubic-bezier(.32,.72,0,1) both}
.shake{animation:shake .42s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.t-main{flex:1;min-width:0}
.t-title{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-title.big{font-size:26px}
.t-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--ink);flex:none;transition:background .15s,transform .12s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:auto;padding:10px 12px;direction:ltr;text-align:left;resize:vertical}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg3 .seg-thumb{width:calc(33.333% - 2.667px)}
.buybar{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--danger-soft);border-radius:var(--r);padding:12px 14px;transition:transform .12s}
.buybar:active{transform:scale(.98)}
.buybar .main{flex:1;min-width:0;display:flex;flex-direction:column}
.buybar b{font-family:var(--f-disp);font-weight:600;color:var(--danger)}
.buybar .main span{font-size:13px;color:var(--ink)}
.buybar .chev{color:var(--danger)}
.beacon.sm{width:38px;height:38px}
.need{display:flex;flex-direction:column;align-items:center;flex:none;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:4px 10px;min-width:54px}
.need b{font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1.15}
.need small{font-size:11px;font-weight:600}
.row button.main{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.theme-btn{background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px}
.theme-btn svg{width:20px;height:20px;animation:pop .35s ease}
.theming,.theming *{transition:background-color .35s ease,color .35s ease,border-color .35s ease!important}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);padding:5px 11px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--accent)} .sync.local i{background:var(--warn)}

/* buttons */
.btn{height:48px;padding-inline:18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--danger) 30%,transparent)}
.btn.danger-soft{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:38px;padding-inline:12px;font-size:14px;border-radius:11px}
.btn.sm svg{width:17px;height:17px}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}

.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.h2{font-family:var(--f-disp);font-weight:600;font-size:17px;margin:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgb(20 24 28 / .22)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(120deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000 100%);pointer-events:none}
.hero .gear{position:absolute;inset-inline-end:-46px;top:-46px;width:170px;height:170px;color:var(--hero-btn);opacity:.2;animation:spin 40s linear infinite;pointer-events:none}
.hero .gear.g2{inset-inline-end:84px;top:78px;width:74px;height:74px;opacity:.12;animation-direction:reverse;animation-duration:22s}
.hero > *{position:relative;z-index:1}
.h-date{font-size:13px;color:var(--hero-muted);font-weight:500}
.h-title{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1.2;text-wrap:balance}
.h-figs{display:flex;gap:22px;flex-wrap:wrap}
.h-fig b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.1}
.h-fig span{font-size:12px;color:var(--hero-muted)}
.h-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h-actions .btn{height:52px;border-radius:16px}
.h-actions .go{background:var(--hero-btn);color:var(--hero-btn-ink)}
.h-actions .ghost{background:rgb(255 255 255 / .1);color:var(--hero-ink)}

/* alarm */
.alarm{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1.5px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.tape{height:9px;background:repeating-linear-gradient(-45deg,var(--hz) 0 10px,var(--hz-ink) 10px 20px);background-size:28px 9px;animation:tape 1.2s linear infinite}
.alarm-head{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.beacon{width:42px;height:42px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;animation:beacon 1.6s infinite;flex:none}
.beacon svg{width:22px;height:22px}
.alarm-head b{font-family:var(--f-disp);font-weight:700;font-size:17px;display:block;line-height:1.3}
.alarm-head span{font-size:13px;color:var(--muted)}
.alarm-list{display:flex;flex-direction:column;padding:4px 8px 10px}
.a-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;text-align:start;width:100%;transition:background .15s}
.a-item:hover{background:var(--surface-2)}
.a-item .main{flex:1;min-width:0}
.a-item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.a-item .sb{font-size:12.5px;color:var(--muted)}
.a-item > svg{width:18px;height:18px;color:var(--muted)}
.picker > svg{width:20px;height:20px;color:var(--muted)}
.a-item .q{font-family:var(--f-disp);font-weight:700;color:var(--danger);font-size:18px}
.okcard{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r);padding:14px 16px;font-weight:600}
.okcard svg{width:24px;height:24px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-align:start;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.stat:active{transform:scale(.97)}
.stat svg{width:20px;height:20px;color:var(--accent)}
.stat b{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}

.demo{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px}
.demo p{margin:0;flex:1}
.demo .btn{background:var(--surface);color:var(--warn)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:start;width:100%;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);width:18px;height:18px}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.tile svg{width:24px;height:24px}
.st-near .tile{background:var(--warn-soft);color:var(--warn)}
.st-low .tile{background:var(--danger-soft);color:var(--danger)}
.qty{text-align:end;display:flex;flex-direction:column;align-items:flex-end;flex:none;min-width:56px}
.qty b{font-family:var(--f-disp);font-size:22px;font-weight:700;line-height:1.1}
.qty small{font-size:11.5px;color:var(--muted)}
.st-low .qty b{color:var(--danger)} .st-near .qty b{color:var(--warn)}
.meter{position:relative;height:5px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:visible}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.st-near .meter i{background:var(--warn)} .st-low .meter i{background:var(--danger)}
.meter b{position:absolute;top:-3px;width:2px;height:11px;border-radius:1px;background:var(--ink);opacity:.55}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.low{background:var(--danger-soft);color:var(--danger)}
.pill.near{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}

/* move rows */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mbadge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.mbadge svg{width:20px;height:20px}
.m-out .mbadge{background:var(--warn-soft);color:var(--warn)}
.m-in .mbadge{background:var(--accent-soft);color:var(--accent)}
.m-adj .mbadge{background:var(--surface-2);color:var(--muted)}
.mrow .main{flex:1;min-width:0}
.mrow .delta{text-align:end;flex:none}
.mrow .delta b{font-family:var(--f-disp);font-weight:700;font-size:18px;display:block;line-height:1.2;unicode-bidi:isolate}
.m-out .delta b{color:var(--warn)} .m-in .delta b{color:var(--accent)}
.mrow .delta small{font-size:11.5px;color:var(--muted)}
.dayhead{font-size:12.5px;font-weight:700;color:var(--muted);padding:2px 4px}

/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding-inline:12px;height:48px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search svg{width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding-inline:14px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--f-disp);font-size:12px;opacity:.7}
.chip.dz.on{background:var(--danger);color:#fff}
.sel{height:46px;border-radius:12px;border:1.5px solid var(--line);background-color:var(--surface);padding-inline:14px 40px;width:100%;font-weight:500;cursor:pointer;outline:none;transition:border-color .15s}
.sel:focus{border-color:var(--accent)}

/* detail */
.dcard{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.d-top{display:flex;align-items:flex-start;gap:14px}
.d-top .tile{width:54px;height:54px;border-radius:16px}
.d-top .tile svg{width:30px;height:30px}
.d-name{font-family:var(--f-disp);font-weight:700;font-size:21px;line-height:1.3;text-wrap:balance}
.big-q{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big-q b{font-family:var(--f-disp);font-size:56px;font-weight:700;line-height:.95}
.st-low .big-q b{color:var(--danger)} .st-near .big-q b{color:var(--warn)}
.big-q span{color:var(--muted);font-size:14px;padding-bottom:6px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--surface-2)}
.gauge i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.st-near .gauge i{background:var(--warn)} .st-low .gauge i{background:var(--danger)}
.gauge b{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.d-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-actions .btn svg{width:20px;height:20px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;text-align:start;transition:transform .12s}
.lchip:active{transform:scale(.96)}
.lchip svg{width:18px;height:18px;color:var(--accent)}
.lchip small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.kv b{font-family:var(--f-disp);font-size:22px;font-weight:700;display:block;line-height:1.2}
.kv span{font-size:12px;color:var(--muted)}

.empty{padding:26px 18px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:34px;height:34px;color:var(--muted);opacity:.7}

  return {lines:mark(L),eqs:mark(E),parts:mark(Pt),moves:mark(M)};

async function initStore(){
  let cl=null;
  try{cl=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null}catch(e){cl=null}
  if(cl){
    db=cl;S.mode='cloud';
    const got=new Set();
    Object.entries(COL).forEach(([k,c])=>{
      let q=db.collection(c);
      if(k==='moves')q=q.orderBy('at','desc').limit(1000);
      q.onSnapshot(snap=>{
        S[k]=snap.docs.map(d=>({...d.data(),id:d.id}));
        got.add(k);
        if(got.size===4){if(!S.ready){S.ready=true;onReady()}else scheduleRender()}
      },()=>toast('الاتصال بالبيانات وقف. افتح الصفحة تاني.',true));
    });
  }else{
    S.mode='local';loadLocal();S.ready=true;onReady();
  }
}
function fail(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){S.canWrite=false;toast('معندكش صلاحية تعديل على البيانات دي',true);}
  else if(c==='quota_exceeded')toast('مساحة البيانات اتملت. امسح بيانات قديمة.',true);
  else toast('العملية متمتش. جرّب تاني.',true);
}
async function put(k,id,data){
  const body={...data};delete body.id;
  if(S.mode==='cloud'){await db.collection(COL[k]).doc(id).set(body);return}
  const arr=S[k],i=arr.findIndex(x=>x.id===id),row={...body,id};
  if(i<0)arr.push(row);else arr[i]=row;
  if(k==='moves')arr.sort((a,b)=>a.at<b.at?1:-1);
  saveLocal();scheduleRender();
}
async function patch(k,id,data){
  if(S.mode==='cloud'){await db.collection(COL[k]).doc(id).update(data);return}
  const r=S[k].find(x=>x.id===id);if(r)Object.assign(r,data);saveLocal();scheduleRender();
}
async function del(k,id){
  if(S.mode==='cloud'){await db.collection(COL[k]).doc(id).delete();return}
  S[k]=S[k].filter(x=>x.id!==id);saveLocal();scheduleRender();
}
/* stock change: lease the part document so two phones never overwrite each other's count */
async function bumpQty(pid,delta){
  if(S.mode!=='cloud'){
    const p=part(pid);if(!p)throw {code:'gone'};
    const nq=(+p.qty||0)+delta;if(nq<0)throw {code:'neg',avail:p.qty};
    p.qty=nq;saveLocal();return nq;
  }
  const ref=db.collection('parts').doc(pid);
  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder:TAB_ID,ttlMs:2000});
    if(r.acquired){
      const s=await ref.get();if(!s.exists)throw {code:'gone'};
      const cur=Number(s.data().qty)||0,nq=cur+delta;
      if(nq<0)throw {code:'neg',avail:cur};
      await ref.update({qty:nq});return nq;
    }
    await sleep(250+Math.random()*350);
  }
  throw {code:'busy'};
}
function moveDoc(p,type,qty,delta,extra){
  const e=extra.eqId?eq(extra.eqId):null,l=e?line(e.lineId):null;
  return {type,partId:p.id,partName:p.name,qty,delta,eqId:e?e.id:'',eqName:e?e.name:'',lineId:l?l.id:'',lineName:l?l.name:'',tech:extra.tech||'',note:extra.note||'',after:extra.after,at:new Date().toISOString()};
}

/* ---------- export / import ---------- */
async function saveFile(name,text,mime){
  let dl=null;
  try{dl=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data:text});return 'ok'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  if(window.top===window){
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return 'ok'}catch(e){if(e&&e.name==='AbortError')return 'declined'}
    }
    try{const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'ok'}catch(e){}
  }
  return 'fallback';
}
const stamp=()=>new Date().toISOString().slice(0,10);
async function exportJson(){
  const strip=a=>a.map(x=>({...x}));
  const text=JSON.stringify({app:'spare-parts',format:1,appVersion:APP_VER,exportedAt:new Date().toISOString(),lines:strip(S.lines),eqs:strip(S.eqs),parts:strip(S.parts),moves:strip(S.moves)},null,1);
  const r=await saveFile(`spare-parts-${stamp()}.json`,text,'application/json');
  if(r==='ok'){lsSet('spare-last-backup',new Date().toISOString());S.exportText=null;toast('النسخة الاحتياطية اتحفظت');render(false)}
  else if(r==='fallback'){S.exportText=text;render(false);requestAnimationFrame(()=>$('#exportBox')?.scrollIntoView({block:'center',behavior:'smooth'}))}
}

const ID_OK=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
function parseBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){return null}
  if(!d||d.app!=='spare-parts')return null;
  for(const k of ['lines','eqs','parts','moves']){
    if(!Array.isArray(d[k]))return null;
    if(!d[k].every(x=>x&&typeof x==='object'&&ID_OK.test(String(x.id))&&x.id!=='.'&&x.id!=='..'))return null;
  }
  if(!d.parts.every(p=>typeof p.name==='string'&&Number.isFinite(+p.qty)&&Number.isFinite(+p.min)))return null;
  d.parts.forEach(p=>{p.qty=Math.max(0,Math.floor(+p.qty));p.min=Math.max(0,Math.floor(+p.min));p.eqIds=Array.isArray(p.eqIds)?p.eqIds.map(String):[]});
  return d;
}
function askImport(text){
  const d=parseBackup(text);
  if(!d){toast('الملف ده مش نسخة احتياطية من مخزن قطع الغيار',true);return}
  const when=d.exportedAt?` (اتعملت ${fShort.format(new Date(d.exportedAt))})`:'';
  openConfirm('استيراد النسخة؟',`كل البيانات اللي في التطبيق دلوقتي هتتبدل باللي في الملف${esc(when)}: ${N(d.parts.length)} صنف، ${N(d.eqs.length)} معدة، ${N(d.lines.length)} خط، ${N(d.moves.length)} حركة.`,'استيراد',async()=>{
    await replaceAll(d);S.pasteOpen=false;S.exportText=null;toast('تم الاستيراد');go('home');
  });
}
async function replaceAll(d){
  if(S.mode!=='cloud'){
    S.lines=d.lines;S.eqs=d.eqs;S.parts=d.parts;S.moves=d.moves.slice().sort((a,b)=>a.at<b.at?1:-1);saveLocal();return;
  }
  const total=['moves','parts','eqs','lines'].reduce((n,k)=>n+S[k].length+d[k].length,0)||1;let n=0;
  const tick=()=>{if(++n%20===0)toast(`بيستورد… ${Math.round(n/total*100)}%`)};
  for(const k of ['moves','parts','eqs','lines']){const keep=new Set(d[k].map(x=>String(x.id)));for(const r of S[k].slice()){if(!keep.has(r.id))await del(k,r.id);tick()}}
  for(const k of ['lines','eqs','parts','moves'])for(const r of d[k]){await put(k,String(r.id),r);tick()}
}
async function clearAll(onlyDemo){
  for(const k of ['moves','parts','eqs','lines'])for(const r of S[k].filter(x=>!onlyDemo||x.demo))await del(k,r.id);
}

/* ---------- navigation ---------- */
/* Pushed pages get a browser-history entry when the app runs on its own (installed / GitHub Pages),
   so Android's back button and back gesture step back inside the app instead of closing it. */
const STANDALONE=window.top===window;
let skipPop=0;
function histPush(){if(STANDALONE)try{history.pushState({sp:S.stack.length},'')}catch(e){}}
function histDrop(n){if(STANDALONE&&n>0&&history.state&&history.state.sp){skipPop++;try{history.go(-Math.min(n,history.state.sp))}catch(e){skipPop--}}}
function go(tab,anim=true){const n=S.stack.length;S.tab=tab;S.stack=[];S.anim='tab';render(anim);window.scrollTo({top:0});histDrop(n)}
function push(v,id){S.stack.push({v,id});S.anim='push';if(v==='eq')S.eqLog='all';render();window.scrollTo({top:0});histPush()}
function back(anim=true){S.stack.pop();S.anim='pop';render(anim);window.scrollTo({top:0});histDrop(1)}
addEventListener('popstate',()=>{
  if(skipPop){skipPop--;return}
  if(SH){closeSheet();if(S.stack.length)histPush();return}
  if(S.stack.length){S.stack.pop();S.anim='pop';render();window.scrollTo({top:0})}
});

/* ---------- swipe back from either screen edge ---------- */
const EASE='cubic-bezier(.32,.72,0,1)';
function backTarget(){
  if(S.stack.length)return {tab:S.tab,stack:S.stack.slice(0,-1)};
  if(S.tab!=='home')return {tab:'home',stack:[]};
  return null;
}
function mountUnderlay(t){
  $('#underlay')?.remove();

const eb={track:false,on:false,decided:false,dir:1,x0:0,y0:0,dx:0,vel:0,lx:0,lt:0,ul:null,t:null};
const EDGE=26;
document.addEventListener('touchstart',e=>{
  eb.track=false;

  const tc=e.touches[0],W=window.innerWidth;
  const dir=tc.clientX<=EDGE?1:tc.clientX>=W-EDGE?-1:0;
  if(!dir)return;
  const t=backTarget();if(!t)return;
  Object.assign(eb,{track:true,on:false,decided:false,dir,x0:tc.clientX,y0:tc.clientY,dx:0,vel:0,lx:tc.clientX,lt:e.timeStamp,t});

    if(!(mx*eb.dir>0&&Math.abs(mx)>Math.abs(my)*1.2)){eb.track=false;return}

  eb.lx=tc.clientX;eb.lt=e.timeStamp;

  const pr=Math.min(1,eb.dx/window.innerWidth);

function endEdge(){
  if(!eb.on){eb.track=false;return}

  const ulTo=(x,dim,ms)=>{ul.style.transition=`transform ${ms}ms ${EASE}`;ul.style.transform=`translateX(${x}%)`;const dm=ul.lastChild;dm.style.transition=`opacity ${ms}ms`;dm.style.opacity=dim};
  if(!commit){el.style.transition=`transform .3s ${EASE}`;el.style.transform='';ulTo(-30*dir,.12,300);setTimeout(()=>{clean();ul.remove()},300);return}
  el.style.transition=`transform .24s ${EASE}`;el.style.transform=`translateX(${dir*100}%)`;ulTo(0,0,240);
  setTimeout(()=>{

}
function openAlerts(){
  const low=lowParts();if(!low.length)return;
  const sh=openSheet('alerts');
  sh.body.innerHTML=`<div class="tape" style="border-radius:6px;margin-bottom:14px"></div>
  <div class="sh-head"><span class="beacon">${ic('alert',2)}</span><h2>تنبيه خطر</h2><button class="iconbtn" data-act="sheet-close" aria-label="إغلاق">${ic('x',2)}</button></div>
  <p style="margin:-6px 0 14px;color:var(--muted)">${N(low.length)} ${low.length===1?'صنف وصل':'أصناف وصلت'} للحد الأدنى أو أقل منه.</p>
  <div class="list">${low.map(p=>{const es=(p.eqIds||[]).map(i=>eq(i)?.name).filter(Boolean);
    return `<div class="row st-low"><span class="tile">${ic('bearing')}</span><span class="main"><span class="r-title">${esc(p.name)}</span><span class="r-sub">${esc(es.join('، '))}</span></span>
    <span class="qty"><b>${N(p.qty)}</b><small>الحد ${N(p.min)}</small></span><button class="btn sm" data-act="move" data-type="in" data-id="${p.id}" aria-label="إيداع">${ic('in',2)}</button></div>`}).join('')}</div>
  <div class="row2" style="margin-top:16px"><button class="btn" data-act="sheet-close">تمام</button><button class="btn primary" data-act="open-buy">${ic('cart',2)}قائمة الشراء</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'tab':closeSheet(true);go(t.dataset.tab);break;
    case 'back':back();break;
    case 'theme':{const order=['auto','light','dark'];setTheme(order[(order.indexOf(S.theme)+1)%3]);toast({auto:'تلقائي: زي إعدادات الموبايل',light:'الوضع النهاري',dark:'الوضع الليلي'}[S.theme]);break}
    case 'open-part':closeSheet(true);push('part',id);break;
    case 'open-eq':closeSheet(true);push('eq',id);break;
    case 'open-line':push('line',id);break;
    case 'low-all':S.partFilter='low';S.q='';go('parts');break;
    case 'pfilter':S.partFilter=t.dataset.v;render(false);break;
    case 'lfilter':S.logType=t.dataset.v;render(false);break;
    case 'eqlog':S.eqLog=t.dataset.v;render(false);break;
    case 'move':if(!S.canWrite)return toast('معندكش صلاحية تعديل',true);openMove(t.dataset.type,id,t.dataset.eq);break;
    case 'new-part':openPartForm();break;
    case 'new-eq':openEqForm(null,t.dataset.line);break;
    case 'new-line':openLineForm();break;
    case 'edit-part':openPartForm(part(id));break;
    case 'edit-eq':openEqForm(eq(id));break;
    case 'edit-line':openLineForm(line(id));break;
    case 'sheet-close':closeSheet();break;
    case 'seg':{const st=SH.state;st.type=t.dataset.v;if(st.type==='out'&&!st.tech)st.tech=lsGet('spare-tech')||'';SH.draw();break}
    case 'pick-toggle':SH.state.pickOpen=!SH.state.pickOpen;SH.draw();if(SH.state.pickOpen)setTimeout(()=>$('#pq')?.focus(),50);break;
    case 'pick-part':{const st=SH.state;st.pid=id;st.pickOpen=false;st.pq='';SH.draw();break}
    case 'pick-eq':SH.state.eqId=id;SH.draw();break;
    case 'step':{const st=SH.state;st.qty=Math.max(1,(Math.floor(+st.qty)||0)+(+t.dataset.d));const i=$('#mvQty');if(i)i.value=st.qty;updateHint();break}
    case 'eqs-toggle':SH.state.open=!SH.state.open;SH.draw();break;
    case 'confirm-ok':{const fn=SH.state.fn;t.disabled=true;try{await fn();closeSheet()}catch(e){t.disabled=false;fail(e)}break}
    case 'del-part':{const p=part(id);openConfirm('امسح الصنف؟',`«${esc(p.name)}» هيتمسح من المخزن. السجلات القديمة بتاعته هتفضل موجودة.`,'امسح',async()=>{await del('parts',id);toast('اتمسح الصنف')});break}
    case 'del-eq':{const e=eq(id),n=partsOfEq(id).length;openConfirm('امسح المعدة؟',`«${esc(e.name)}» هتتمسح${n?` وهتتفك من ${N(n)} قطعة غيار`:''}.`,'امسح',async()=>{for(const p of partsOfEq(id))await patch('parts',p.id,{eqIds:(p.eqIds||[]).filter(x=>x!==id)});await del('eqs',id);toast('اتمسحت المعدة')});break}
    case 'del-line':{const l=line(id),n=eqsOf(id).length;if(n){closeSheet();toast(`الخط عليه ${N(n)} معدة. انقلها أو امسحها الأول.`,true);break}
      openConfirm('امسح الخط؟',`«${esc(l.name)}» هيتمسح.`,'امسح',async()=>{await del('lines',id);toast('اتمسح الخط')});break}
    case 'clear-demo':openConfirm('امسح البيانات التجريبية؟','كل الخطوط والمعدات والقطع والحركات التجريبية هتتمسح، وتبدأ بمخزن فاضي.','امسح الكل',async()=>{
      await clearAll(true);toast('المخزن فاضي. ابدأ بخط إنتاج.')});break;
    case 'clear-all':openConfirm('امسح كل البيانات؟',`${N(S.parts.length)} صنف و${N(S.eqs.length)} معدة و${N(S.lines.length)} خط و${N(S.moves.length)} حركة هيتمسحوا نهائي. اعمل نسخة احتياطية الأول لو محتاجها.`,'امسح الكل',async()=>{await clearAll(false);toast('اتمسحت كل البيانات');go('home')});break;
    case 'open-settings':closeSheet(true);S.exportText=null;S.pasteOpen=false;push('settings','settings');break;
    case 'export-json':exportJson();break;
    case 'open-buy':closeSheet(true);push('buy','buy');break;
    case 'export-buy':exportBuy();break;
    case 'copy-buy':copyBuy();break;
    case 'export-stock':exportStock();break;
    case 'export-log':exportLog();break;
    case 'toggle-paste':S.pasteOpen=!S.pasteOpen;render(false);if(S.pasteOpen)setTimeout(()=>$('#importBox')?.focus(),60);break;
    case 'import-text':{const v=$('#importBox')?.value||'';if(v.trim())askImport(v);else toast('الصق محتوى الملف الأول',true);break}
    case 'copy-export':{const box=$('#exportBox');try{await navigator.clipboard.writeText(S.exportText);lsSet('spare-last-backup',new Date().toISOString());toast('اتنسخ')}catch(e){if(box){box.focus();box.select()}}break}
    case 'set-theme':setTheme(t.dataset.v);break;
  }
});
function updateHint(){
  const st=SH&&SH.state,p=st&&part(st.pid),h=$('#qHint');if(!p||!h)return;
  const after=(+p.qty||0)+(st.type==='out'?-(+st.qty||0):(+st.qty||0));
  h.innerHTML=`المتاح دلوقتي <b class="num">${N(p.qty)}</b> · بعد العملية <b class="num" style="color:${after<0?'var(--danger)':after<=p.min?'var(--warn)':'inherit'}">${N(after)}</b>`;
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='partSearch'){S.q=t.value;const l=$('#partsList');if(l)l.innerHTML=partsList();return}
  if(!SH)return;const st=SH.state;
  switch(t.id){
    case 'pq':st.pq=t.value;$('#pickList').innerHTML=pickList(st);break;
    case 'mvQty':st.qty=t.value;updateHint();break;
    case 'mvTech':st.tech=t.value;break;
    case 'mvNote':st.note=t.value;break;
    case 'pName':st.name=t.value;break;
    case 'pQty':st.qty=t.value;break;
    case 'pMin':st.min=t.value;break;
    case 'eName':st.name=t.value;break;
    case 'lName':st.name=t.value;break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='logEq'){S.logEq=t.value;render(false);return}
  if(t.id==='importFile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>askImport(String(fr.result||''));fr.readAsText(t.files[0]);t.value='';return}
  if(!SH)return;const st=SH.state;
  if(t.id==='mvEq'){st.eqId=t.value;SH.draw()}
  else if(t.id==='eLine'){st.lineId=t.value}
  else if(t.dataset.eqchk){const id=t.dataset.eqchk;st.eqIds=t.checked?[...st.eqIds,id]:st.eqIds.filter(x=>x!==id);const m=$('#eqMulti');if(m)m.innerHTML=multiTags(st)+ic('down').replace('<svg','<svg class="caret"')}
});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  ({move:submitMove,part:submitPart,eq:submitEq,line:submitLine})[f.dataset.form]();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});
addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>4),{passive:true});

/* ---------- boot ---------- */
function onReady(){
  S.anim='tab';render();
  if(lowParts().length)setTimeout(openAlerts,550);
}
render();
initStore();

/* installed app: check for a new version on every open, reload when it takes over (never mid-form) */
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window&&document.querySelector('link[rel="manifest"]')){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  let reloading=false;
  const reloadNow=()=>{if(reloading)return;reloading=true;location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had)return;
    toast('فيه نسخة جديدة، بيتحدّث…');
    const iv=setInterval(()=>{if(!SH){clearInterval(iv);setTimeout(reloadNow,800)}},700);
  });
}
</script>
